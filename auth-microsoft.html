<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectando con Microsoft…</title>
</head>
<body style="font-family: system-ui, sans-serif; padding: 40px; text-align: center; color: #444">
  <p>Conectando con Microsoft… esta ventana se cerrará sola.</p>
  <script>
    // Página de retorno del inicio de sesión de Microsoft: pasa el resultado a la aplicación y se cierra.
    if (window.opener) {
      window.opener.postMessage({ tipo: "auth-microsoft", busqueda: location.search }, location.origin);
    } else {
      document.body.innerHTML = "<p>Puedes cerrar esta ventana y volver a la aplicación.</p>";
    }
  </script>
</body>
</html>
